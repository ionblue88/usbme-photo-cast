name: Build release binaries

on:
  push:
    tags: ["v*"]            # a version tag builds all binaries and publishes a Release
  workflow_dispatch: {}     # manual run from the Actions tab -> builds artifacts only (no Release)

permissions:
  contents: write           # allow the Release step to upload assets

jobs:
  build:
    strategy:
      fail-fast: false      # one OS failing shouldn't block the others
      matrix:
        include:
          - os: windows-latest                                          # x86_64
            asset: USBmePhotoCast-windows-x86_64.exe
          - os: macos-14                                                # Apple Silicon (arm64)
            asset: USBmePhotoCast-macos-arm64.tar.gz
          - os: macos-13                                                # Intel (x86_64)
            asset: USBmePhotoCast-macos-x86_64.tar.gz
          - os: ubuntu-24.04                                            # glibc 2.39
            asset: USBmePhotoCast-linux-x86_64-ubuntu24.04.tar.gz
          - os: ubuntu-22.04                                            # glibc 2.35 (broader compat)
            asset: USBmePhotoCast-linux-x86_64-ubuntu22.04.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow pyserial numpy pillow-heif pillow-avif-plugin

      - name: Build
        run: pyinstaller --onefile --windowed --name USBmePhotoCast --collect-all pillow_heif --collect-all pillow_avif usbme_photo_cast.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/USBmePhotoCast.exe "dist/${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tar -czf "dist/${{ matrix.asset }}" -C dist USBmePhotoCast.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "dist/${{ matrix.asset }}" -C dist USBmePhotoCast

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
